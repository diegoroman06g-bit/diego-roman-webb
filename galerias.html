<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Galerías | Diego Román</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .fotos{column-width:240px;column-gap:14px}
    .fotos .item{position:relative;margin-bottom:14px;break-inside:avoid}
    .fotos img{width:100%;height:auto;display:block;border-radius:4px;background:#c7d2de}
  </style>
</head>
<body>

<header>
  <b><a href="/" style="text-decoration:none">Diego Román</a></b>
  <nav><a class="keep" href="/">Inicio</a></nav>
</header>

<section>
  <div id="app"><p>Cargando…</p></div>
</section>

<script>
const app = document.getElementById("app");
const slug = new URLSearchParams(location.search).get("g");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

function mostrar(g) {
  app.innerHTML = `
    <div class="bar"><h2>${esc(g.titulo)}</h2></div>
    <div class="fotos">
      ${g.fotos.map((f) => `
        <div class="item">
          <img src="${f.url}" loading="lazy" alt="">
          <a class="dl" href="${f.url}?download=${encodeURIComponent(f.nombre)}">Descargar</a>
        </div>`).join("")}
    </div>`;
}

(async () => {
  try {
    if (slug) {
      const r = await fetch("/api/galleries?slug=" + encodeURIComponent(slug));
      if (!r.ok) throw new Error("No existe");
      mostrar(await r.json());
    } else {
      const lista = await (await fetch("/api/galleries")).json();
      app.innerHTML = "<h2>Galerías públicas</h2>" + (lista.length
        ? '<div class="grid">' + lista.map((g) => `
            <a class="card" style="margin:0;text-decoration:none" href="?g=${g.slug}">
              <h3>${esc(g.titulo)}</h3>
              <small>${g.total} fotos</small>
            </a>`).join("") + "</div>"
        : "<p>Aún no hay galerías públicas.</p>");
    }
  } catch (e) {
    app.innerHTML = "<h2>Galería no encontrada</h2><p>Revisa que el enlace esté completo o pídele uno nuevo a Diego.</p>";
  }
})();
</script>

</body>
</html>
